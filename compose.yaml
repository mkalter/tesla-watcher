services:
  whatsapp:
    build: ./bridge
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run python tools/setup.py first}
      WHATSAPP_TO: ${WHATSAPP_TO:?Set your receiving number in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - whatsapp-data:/app/data
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  scanner:
    build: .
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run python tools/setup.py first}
    volumes:
      - ./config.docker.json:/app/config.json:ro
      - scanner-data:/app/data
    depends_on:
      whatsapp:
        condition: service_healthy
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  scanner-data:
  whatsapp-data:
